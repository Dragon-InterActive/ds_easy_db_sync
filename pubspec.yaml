version: 0.1.0
homepage: https://github.com/Dragon-InterActive/ds_easy_db_sync
repository: https://github.com/Dragon-InterActive/ds_easy_db_sync
issue_tracker: https://github.com/Dragon-InterActive/ds_easy_db_sync/issues
